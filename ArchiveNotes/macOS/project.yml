name: ArchiveNotes
options:
  bundleIdPrefix: com.archivenotes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  ArchiveCore:
    path: ../../packages/ArchiveCore

targets:
  ArchiveNotes:
    type: application
    platform: macOS
    sources:
      - Sources/ArchiveNotes
    dependencies:
      - package: ArchiveCore
        product: ArchiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.app
        INFOPLIST_FILE: Sources/ArchiveNotes/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Sources/ArchiveNotes/ArchiveNotes.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true

  ArchiveNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ArchiveNotesTests
    dependencies:
      - target: ArchiveNotes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.tests

schemes:
  ArchiveNotes:
    build:
      targets:
        ArchiveNotes: all
        ArchiveNotesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveNotesTests
