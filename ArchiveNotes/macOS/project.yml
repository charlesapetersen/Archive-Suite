name: ArchiveNotes
options:
  bundleIdPrefix: com.archivenotes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Certificate-based signing, NOT ad-hoc ("-") — see the long note in
    # ArchiveReader/macOS/project.yml. Short version: an ad-hoc designated requirement is pinned to the
    # CDHASH, so every rebuild invalidates every TCC grant and macOS re-prompts forever; a cert pins it
    # to the CERT, which is stable. Set at base so app + both test bundles share ONE identity.
    # Self-signed, local-only, never notarized. Create it with ops/setup-signing-cert.sh.
    CODE_SIGN_IDENTITY: "Archive Suite Dev"
    CODE_SIGN_STYLE: Manual

packages:
  ArchiveCore:
    path: ../../packages/ArchiveCore

targets:
  ArchiveNotes:
    type: application
    platform: macOS
    sources:
      - Sources/ArchiveNotes
    dependencies:
      - package: ArchiveCore
        product: ArchiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.app
        INFOPLIST_FILE: Sources/ArchiveNotes/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug uses the UITest entitlements (superset: adds a temporary-exception for the
        # fixture path under /Users/ so XCUITests can read/write tags in the sandbox). The
        # override code path is #if DEBUG + launch-arg gated — inactive in normal Debug runs.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveNotes/ArchiveNotes.uitest.entitlements
        # Release uses the production entitlements (byte-identical to the original).
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveNotes/ArchiveNotes.entitlements

  ArchiveNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ArchiveNotesTests
    dependencies:
      - target: ArchiveNotes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.tests

  ArchiveNotesUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ArchiveNotesUITests
    dependencies:
      - target: ArchiveNotes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.uitests
        TEST_TARGET_NAME: ArchiveNotes
        # ENABLE_HARDENED_RUNTIME: NO is RETAINED. It was found necessary under ad-hoc signing
        # (CODE_SIGN_IDENTITY "-") or the Runner couldn't load the xctest plugin — library validation
        # rejected mismatched CDHashes — the key finding from the Reader harness (W7.1). Signing moved
        # to a certificate on 2026-08-07, which plausibly makes this unnecessary (runner and plugin now
        # share one cert, which is exactly what library validation wants), but that was NOT re-tested,
        # so the known-good setting stays. Don't flip it casually.
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  ArchiveNotes:
    build:
      targets:
        ArchiveNotes: all
        ArchiveNotesTests: [test]
        ArchiveNotesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveNotesTests
        - ArchiveNotesUITests
