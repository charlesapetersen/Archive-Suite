name: ArchiveNotes
options:
  bundleIdPrefix: com.archivenotes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  ArchiveCore:
    path: ../../packages/ArchiveCore

targets:
  ArchiveNotes:
    type: application
    platform: macOS
    sources:
      - Sources/ArchiveNotes
    dependencies:
      - package: ArchiveCore
        product: ArchiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.app
        INFOPLIST_FILE: Sources/ArchiveNotes/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug uses the UITest entitlements (superset: adds a temporary-exception for the
        # fixture path under /Users/ so XCUITests can read/write tags in the sandbox). The
        # override code path is #if DEBUG + launch-arg gated — inactive in normal Debug runs.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveNotes/ArchiveNotes.uitest.entitlements
        # Release uses the production entitlements (byte-identical to the original).
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveNotes/ArchiveNotes.entitlements

  ArchiveNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ArchiveNotesTests
    dependencies:
      - target: ArchiveNotes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.tests

  ArchiveNotesUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ArchiveNotesUITests
    dependencies:
      - target: ArchiveNotes
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivenotes.uitests
        TEST_TARGET_NAME: ArchiveNotes
        # Ad-hoc signing (CODE_SIGN_IDENTITY "-") requires ENABLE_HARDENED_RUNTIME: NO on the
        # UITest target, or the Runner can't load the xctest plugin (library validation rejects
        # mismatched CDHashes) — the key finding from the Reader harness (W7.1).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  ArchiveNotes:
    build:
      targets:
        ArchiveNotes: all
        ArchiveNotesTests: [test]
        ArchiveNotesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveNotesTests
        - ArchiveNotesUITests
