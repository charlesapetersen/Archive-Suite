name: ArchiveReader
options:
  bundleIdPrefix: com.archivereader
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  ArchiveReader:
    type: application
    platform: macOS
    sources:
      - Sources/ArchiveReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archivereader.app
        INFOPLIST_FILE: Sources/ArchiveReader/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug uses the UITest entitlements (superset: adds a temporary-exception for the
        # fixture path so XCUITests can read/write tags in the sandbox). The override code
        # path is #if DEBUG + launch-arg gated — inactive in normal Debug runs.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveReader/ArchiveReader.uitest.entitlements
        # Release uses the production entitlements (byte-identical to the original).
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveReader/ArchiveReader.entitlements

  ArchiveReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ArchiveReaderTests
    dependencies:
      - target: ArchiveReader
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivereader.tests

  ArchiveReaderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ArchiveReaderUITests
    dependencies:
      - target: ArchiveReader
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivereader.uitests
        TEST_TARGET_NAME: ArchiveReader
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  ArchiveReader:
    build:
      targets:
        ArchiveReader: all
        ArchiveReaderTests: [test]
        ArchiveReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveReaderTests
        - ArchiveReaderUITests
