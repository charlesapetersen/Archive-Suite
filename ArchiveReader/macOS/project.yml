name: ArchiveReader
options:
  bundleIdPrefix: com.archivereader
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Certificate-based signing, NOT ad-hoc ("-"). An ad-hoc signature's designated requirement is
    # pinned to the CDHASH, which changes on every rebuild — so macOS forgets every TCC grant
    # (Desktop/Documents/…) and re-prompts forever; with the daemon rebuilding all day that is a
    # prompt per build. A certificate pins the requirement to the CERT instead, which is stable, so
    # one "Allow" survives every rebuild. Set at base so the app AND both test bundles share one
    # identity — the UITest runner (com.archivereader.uitests.xctrunner) is a separate TCC client and
    # would otherwise keep prompting on its own account.
    # Self-signed, local-only, never notarized. Create it with ops/setup-signing-cert.sh.
    CODE_SIGN_IDENTITY: "Archive Suite Dev"
    CODE_SIGN_STYLE: Manual

packages:
  ArchiveCore:
    path: ../../packages/ArchiveCore
  # Reference-image regression testing for the unit bundle (headless; no app launch).
  # Used by SnapshotTests; the render/pixel guards in RenderProbe need no external dep.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"

targets:
  ArchiveReader:
    type: application
    platform: macOS
    sources:
      - Sources/ArchiveReader
    dependencies:
      - package: ArchiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archivereader.app
        INFOPLIST_FILE: Sources/ArchiveReader/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug uses the UITest entitlements (superset: adds a temporary-exception for the
        # fixture path so XCUITests can read/write tags in the sandbox). The override code
        # path is #if DEBUG + launch-arg gated — inactive in normal Debug runs.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveReader/ArchiveReader.uitest.entitlements
        # Release uses the production entitlements (byte-identical to the original).
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/ArchiveReader/ArchiveReader.entitlements

  ArchiveReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ArchiveReaderTests
    dependencies:
      - target: ArchiveReader
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivereader.tests

  ArchiveReaderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ArchiveReaderUITests
    dependencies:
      - target: ArchiveReader
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archivereader.uitests
        TEST_TARGET_NAME: ArchiveReader
        # ENABLE_HARDENED_RUNTIME: NO is RETAINED deliberately. It was found necessary under ad-hoc
        # signing (W7.1) — the Runner couldn't load the xctest plugin because library validation
        # rejected mismatched CDHashes. Certificate signing plausibly makes it unnecessary (runner and
        # plugin now share one cert, which is what library validation wants), but that was NOT
        # re-tested when signing changed, so the working setting stays. Don't flip it casually.
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  ArchiveReader:
    build:
      targets:
        ArchiveReader: all
        ArchiveReaderTests: [test]
        ArchiveReaderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveReaderTests
        - ArchiveReaderUITests
