name: ArchiveProcessor
options:
  bundleIdPrefix: com.archiveprocessor
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Certificate-based signing, NOT ad-hoc ("-") — see the long note in
    # ArchiveReader/macOS/project.yml. Short version: an ad-hoc designated requirement is pinned to the
    # CDHASH, so every rebuild invalidates every TCC grant and macOS re-prompts forever; a cert pins it
    # to the CERT, which is stable.
    # NOTE: unlike Reader/Notes, this target declares NO debug-only entitlement. The
    # `entitlements.properties` map below is shared by every config, so putting get-task-allow or
    # disable-library-validation there would weaken Release. Xcode injects get-task-allow into Debug on its
    # own; the target config below suppresses that base-entitlement injection in Release (W28.cert-fu2).
    # Self-signed, local-only, never notarized. Create it with ops/setup-signing-cert.sh.
    CODE_SIGN_IDENTITY: "Archive Suite Dev"
    CODE_SIGN_STYLE: Manual

packages:
  ArchiveCore:
    path: ../../packages/ArchiveCore

targets:
  ArchiveProcessor:
    type: application
    platform: macOS
    sources:
      - Sources/ArchiveProcessor
      - path: ../../packages/UITestSupport/App   # W40.e9 appearance seam, W40.e13 transient recorder (DEBUG)
      - path: ../../packages/UITestSupport/Shared   # W40.e13 transient analysis, also in the UI suite
      # The segmentation figures, bundled straight from the bench's file (no copy), so a bench re-run reaches the
      # app on its next build (W36.seg-opt-engine). Loaded as Bundle.main "options.json".
      - path: ../segbench-results/options.json
        buildPhase: resources
      # Which OCR model reads which kind of page best, under the model picker (W41.app-ocr-hierarchy).
      - path: ../segbench-results/ocr-page-guidance.json
        buildPhase: resources
      # The page-kind classifier's weights, which preselect each page's reader (W41.app-page-kind).
      - path: ../segbench-results/kind-classifier-model.json
        buildPhase: resources
    dependencies:
      - package: ArchiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archiveprocessor.app
        INFOPLIST_FILE: Sources/ArchiveProcessor/Info.plist
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Xcode 16 otherwise puts the app body in ArchiveProcessor.debug.dylib. The suite's local
          # self-signed certificate has no Team ID, so hardened-runtime library validation rejects that
          # dylib at launch even though both files use the same identity (W28.cert-fu2). Processor has no
          # app-hosted XCTest target and no SwiftUI previews, so keep the ordinary executable layout in
          # Debug instead of weakening library validation.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          # Measured on the signed product: Xcode injected get-task-allow even though the shared entitlement
          # map never declared it. Keep the explicit network/file entitlements below, but refuse Xcode's
          # debugger base entitlement in the distributed build. Hardened runtime remains enabled above.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    entitlements:
      path: Sources/ArchiveProcessor/ArchiveProcessor.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true

  ArchiveProcessorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/ArchiveProcessorUITests
      - path: ../../packages/UITestSupport/Runner   # W40.e9 layout guard, shared by every UI suite
      - path: ../../packages/UITestSupport/Shared   # W40.e13 transient analysis, shared with the app
    dependencies:
      - target: ArchiveProcessor
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.archiveprocessor.uitests
        TEST_TARGET_NAME: ArchiveProcessor
        # The disposable VM has neither the host development certificate nor credentials. The runner
        # must load its XCTest plug-in without hardened-runtime library validation.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  ArchiveProcessor:
    build:
      targets:
        ArchiveProcessor: all
        ArchiveProcessorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveProcessorUITests
