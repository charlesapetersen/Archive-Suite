name: ArchiveCaptureiOS
options:
  bundleIdPrefix: com.archiveprocessor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26"
settings:
  base:
    # Swift 5 language mode for this app target: AVFoundation (camera/QR) fights strict Swift 6
    # concurrency (non-Sendable AVCaptureSession across queues). The Mac app stays Swift 6.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ArchiveCaptureiOS:
    type: application
    platform: iOS
    sources:
      - Sources/ArchiveCaptureiOS
    configFiles:
      Debug: Config/Drive.xcconfig
      Release: Config/Drive.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archiveprocessor.capture.ios
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/ArchiveCaptureiOS/Info.plist
      properties:
        CFBundleDisplayName: Archive Capture
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Used to photograph documents and send them to the Archive Processor Mac app."
        NSPhotoLibraryAddUsageDescription: "Used to save captured photos to your phone's library as a backup, when you tap Save to phone."
        NSLocalNetworkUsageDescription: "Used to connect to the Archive Processor Mac app on your local network to send captured photos."
        NSBonjourServices: ["_archivecap._tcp"]   # must match the Mac's advertised type (CaptureServer.swift)
        ITSAppUsesNonExemptEncryption: false
        # Drive relay OAuth client id, from the gitignored Config/DriveLocal.xcconfig (empty = not
        # configured; Net/DriveOAuthConfig.swift). No CFBundleURLTypes entry for its reversed-client-ID
        # redirect: ASWebAuthenticationSession catches its own callbackURLScheme without one, and a
        # registered scheme cannot be derived from the id in a build setting.
        DriveOAuthClientID: $(DRIVE_OAUTH_CLIENT_ID)
  # W40.i-sim-ui: the app's own controls pressed by touch in a headless simulator, against the real Mac.
  # Driven only by scripts/e2e-ios-ui.sh (it boots the device headless, runs the Mac and serves the control
  # files these tests wait on); not a unit bundle, and not run by any gate.
  ArchiveCaptureiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: ArchiveCaptureiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archiveprocessor.capture.ios.uitests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ArchiveCaptureiOS
schemes:
  ArchiveCaptureiOS:
    build:
      targets:
        ArchiveCaptureiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArchiveCaptureiOSUITests
    archive:
      config: Release
